<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucado de Contatos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        form {
            margin-top: 20px;
        }
        label {
            display: inline-block;
            width: 80px;
        }
        input[type="text"],
        input[type="telefone"] {
            width: 200px;
            padding: 5px;
            margin-bottom: 10px;
        }
        input[type="submit"] {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #85da89;
        }
    </style>
</head>
<body>
    <h1>Bucado de Contatos</h1>
    <form action="contato.html" method="get">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome"><br><br>
    
        <input type="submit" value="Buscar" id="buscar">
    </form>
    <p id="resultado"></p>
    <ul id="contatos">
    </ul>
</body>
<script src="for.js"></script>
</html>
